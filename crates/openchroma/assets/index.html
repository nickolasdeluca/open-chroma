<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenChroma</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #16181d; --muted: #646b78; --line: #dde0e6;
    --accent: #1f9d3a; --accent-text: #ffffff; --warn: #b45309; --danger: #c0262d; --led-off: #d7dae0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1114; --panel: #181b20; --text: #e7e9ee; --muted: #8b93a1; --line: #2a2f37;
      --accent: #44d62c; --accent-text: #0b0d10; --warn: #f0a33a; --danger: #ff6b6b; --led-off: #23272e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 12px 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 20px; min-width: 0; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--accent); border-color: currentColor; }
  .pill.warn { color: var(--warn); border-color: currentColor; }
  .device { border-top: 1px solid var(--line); padding: 14px 0; }
  .device:first-of-type { border-top: 0; padding-top: 0; }
  .device-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .device-name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .err { color: var(--danger); font-size: 12px; }
  .leds { display: grid; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
  .row { display: flex; gap: 3px; align-items: center; }
  .row-label { width: 92px; flex: none; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .led { width: 14px; height: 14px; border-radius: 3px; flex: none; background: var(--led-off); }
  .led.round { border-radius: 50%; }
  .profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .profile { text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; font: inherit; }
  .profile:hover { border-color: var(--muted); }
  .profile.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .profile small { display: block; color: var(--muted); font-size: 11px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], select { width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 36px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  .colors { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .btn { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; font: inherit; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 3px 8px; font-size: 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
  .apps li { margin: 4px 0; }
  .apps { padding-left: 18px; margin: 8px 0 0; }
  .chan { display: grid; grid-template-columns: 1fr 72px 72px; gap: 6px; align-items: end; }
  .chan label { margin-top: 6px; }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .offline main { opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Open<span>Chroma</span></h1>
  <div class="pills" id="pills"></div>
</header>
<main>
  <div>
    <section>
      <h2>Devices</h2>
      <div id="devices"><p class="meta">Looking for devices…</p></div>
    </section>
  </div>
  <div>
    <section>
      <h2>Lighting</h2>
      <label for="brightness">Brightness <span id="brightness-val"></span></label>
      <input type="range" id="brightness" min="0" max="100">
      <div class="toggle" style="margin-top:14px">
        <div>
          <div>Let games control lighting</div>
          <div class="meta">Chroma SDK apps take over while running</div>
        </div>
        <input type="checkbox" id="sdk-enabled">
      </div>
      <ul class="apps" id="apps"></ul>
    </section>
    <section>
      <h2>Profiles</h2>
      <div class="profiles" id="profiles"></div>
      <div class="actions"><button class="btn small" id="new-profile">New profile</button></div>
    </section>
    <section id="editor-section">
      <h2>Edit profile</h2>
      <div id="editor"></div>
    </section>
    <section>
      <h2>ARGB controller channels</h2>
      <div id="channels"></div>
      <p class="note">LED count per channel (max 80). "Link" picks which Chroma Link LED (0-4) drives the channel in games.</p>
      <div class="actions"><button class="btn primary" id="save-channels">Save channels</button></div>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, { dataset, ...props } = {}, ...kids) => {
  // `dataset` is a read-only property, so copy its entries instead.
  const e = Object.assign(document.createElement(tag), props);
  Object.assign(e.dataset, dataset);
  for (const k of kids) e.append(k);
  return e;
};

const EFFECTS = {
  off: { label: 'Off', fields: [] },
  static: { label: 'Static', fields: ['color'] },
  breathing: { label: 'Breathing', fields: ['colors', 'period'] },
  spectrum: { label: 'Spectrum cycle', fields: ['period'] },
  wave: { label: 'Rainbow wave', fields: ['period', 'repeat', 'reverse'] },
  gradient: { label: 'Gradient', fields: ['colors'] },
  color_wave: { label: 'Color wave', fields: ['colors', 'period', 'reverse'] },
  starlight: { label: 'Starlight', fields: ['colors', 'background', 'period'] },
};
const DEFAULTS = { color: '#44d62c', colors: ['#ff0000', '#0000ff'], period: 4, repeat: 1, reverse: false, background: '#000000' };

let config = null;
let status = null;
let editing = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-OpenChroma': 'ui' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

async function saveConfig(msg) {
  try {
    await api('PUT', '/api/config', config);
    config = await api('GET', '/api/config');
    toast(msg || 'Saved');
    renderProfiles();
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

function renderPills() {
  const p = $('pills');
  p.replaceChildren();
  if (!status) {
    p.append(el('span', { className: 'pill warn', textContent: 'Service offline' }));
    return;
  }
  const connected = status.devices.filter((d) => d.connected).length;
  p.append(el('span', { className: 'pill ' + (connected ? 'ok' : 'warn'), textContent: `${connected}/${status.devices.length} devices` }));
  p.append(el('span', {
    className: 'pill ' + (status.sdk_port_bound ? 'ok' : 'warn'),
    textContent: status.sdk_port_bound ? `Chroma SDK on :${status.sdk_port}` : `SDK port ${status.sdk_port} busy (Razer service?)`,
  }));
  const active = status.sessions.find((s) => s.active);
  if (active) p.append(el('span', { className: 'pill ok', textContent: `▶ ${active.title}` }));
}

function zoneLabel(device, i) {
  if (device.id === 'argb' && config) return config.argb_channels[i]?.name || `Channel ${i + 1}`;
  if (device.id === 'case') return `Strip ${i + 1}`;
  if (device.id === 'mouse') return 'Logo · wheel · glow';
  if (device.id === 'keyboard') return `Row ${i + 1}`;
  return '';
}

function renderDevices() {
  const root = $('devices');
  if (!status) return;
  if (!status.devices.length) {
    root.replaceChildren(el('p', { className: 'meta', textContent: 'No supported Razer devices found.' }));
    return;
  }
  // Rebuild structure only when the device set changes; otherwise just recolor.
  const sig = status.devices.map((d) => d.pid + ':' + d.preview.map((r) => r.length).join(',')).join('|');
  if (root.dataset.sig !== sig) {
    root.dataset.sig = sig;
    root.replaceChildren(...status.devices.map((d) => {
      const leds = el('div', { className: 'leds' });
      d.preview.forEach((row, i) => {
        if (!row.length) return;
        const r = el('div', { className: 'row' });
        if (d.preview.length > 1 || d.id === 'mouse') r.append(el('span', { className: 'row-label', textContent: zoneLabel(d, i) }));
        row.forEach(() => r.append(el('span', { className: 'led' + (d.id === 'argb' ? ' round' : '') })));
        leds.append(r);
      });
      return el('div', { className: 'device', dataset: { pid: d.pid } },
        el('div', { className: 'device-head' },
          el('span', { className: 'device-name', textContent: d.name }),
          el('span', { className: 'meta', textContent: [d.pid, d.firmware, d.serial].filter(Boolean).join(' · ') })),
        el('div', { className: 'err' }),
        leds);
    }));
  }
  for (const d of status.devices) {
    const node = root.querySelector(`[data-pid="${d.pid}"]`);
    if (!node) continue;
    node.querySelector('.err').textContent = d.connected ? '' : (d.error || 'Not connected, retrying…');
    const rows = [...node.querySelectorAll('.row')];
    d.preview.filter((r) => r.length).forEach((row, i) => {
      const leds = rows[i]?.querySelectorAll('.led') || [];
      row.forEach((c, j) => { if (leds[j]) leds[j].style.background = c; });
    });
  }
}

function renderSettings() {
  if (!status) return;
  if (document.activeElement !== $('brightness')) $('brightness').value = status.brightness;
  $('brightness-val').textContent = status.brightness + '%';
  $('sdk-enabled').checked = status.sdk_enabled;
  $('apps').replaceChildren(...status.sessions.map((s) =>
    el('li', { textContent: `${s.title} (${s.client.kind === 'rest' ? 'REST' : 'native'})${s.active ? ' — controlling lights' : ''}` })));
}

function describe(effect) {
  return EFFECTS[effect.type]?.label || effect.type;
}

function renderProfiles() {
  if (!config) return;
  $('profiles').replaceChildren(...config.profiles.map((p) => {
    const b = el('button', { className: 'profile' + (p.name === config.active_profile ? ' active' : '') },
      p.name, el('small', { textContent: describe(p.effect) }));
    b.onclick = async () => {
      await api('POST', '/api/settings', { active_profile: p.name });
      config.active_profile = p.name;
      editing = p.name;
      renderProfiles();
      renderEditor();
    };
    return b;
  }));
}

function colorList(values, onChange) {
  const wrap = el('div', { className: 'colors' });
  const draw = () => {
    wrap.replaceChildren(...values.map((c, i) => {
      const input = el('input', { type: 'color', value: c, title: 'Right-click to remove' });
      input.oninput = () => { values[i] = input.value; onChange(); };
      input.oncontextmenu = (ev) => {
        ev.preventDefault();
        if (values.length > 1) { values.splice(i, 1); draw(); onChange(); }
      };
      return input;
    }));
    const add = el('button', { className: 'btn small', textContent: '+' });
    add.onclick = () => { values.push(values[values.length - 1] || '#ffffff'); draw(); onChange(); };
    wrap.append(add);
  };
  draw();
  return wrap;
}

function renderEditor() {
  const root = $('editor');
  const profile = config?.profiles.find((p) => p.name === (editing || config.active_profile));
  if (!profile) { root.replaceChildren(); return; }
  editing = profile.name;
  const draft = JSON.parse(JSON.stringify(profile));
  let preview;
  const live = () => {
    // Show edits on the hardware immediately by saving after a short pause.
    clearTimeout(preview);
    preview = setTimeout(() => {
      Object.assign(profile, JSON.parse(JSON.stringify(draft)));
      saveConfig('Updated');
    }, 350);
  };

  const name = el('input', { type: 'text', value: draft.name });
  const type = el('select');
  for (const [k, v] of Object.entries(EFFECTS)) type.append(el('option', { value: k, textContent: v.label, selected: k === draft.effect.type }));
  const fields = el('div');

  const drawFields = () => {
    const e = draft.effect;
    fields.replaceChildren();
    for (const f of EFFECTS[e.type].fields) {
      if (e[f] === undefined) e[f] = JSON.parse(JSON.stringify(DEFAULTS[f]));
      if (f === 'colors') fields.append(el('label', { textContent: 'Colors (right-click a color to remove it)' }), colorList(e.colors, live));
      if (f === 'color' || f === 'background') {
        const input = el('input', { type: 'color', value: e[f] });
        input.oninput = () => { e[f] = input.value; live(); };
        fields.append(el('label', { textContent: f === 'color' ? 'Color' : 'Background' }), input);
      }
      if (f === 'period' || f === 'repeat') {
        const input = el('input', { type: 'number', value: e[f], min: f === 'period' ? 0.5 : 0.1, step: f === 'period' ? 0.5 : 0.1 });
        input.oninput = () => { const v = parseFloat(input.value); if (v > 0) { e[f] = v; live(); } };
        fields.append(el('label', { textContent: f === 'period' ? 'Cycle length (seconds)' : 'Repeats across device' }), input);
      }
      if (f === 'reverse') {
        const input = el('input', { type: 'checkbox', checked: !!e.reverse });
        input.onchange = () => { e.reverse = input.checked; live(); };
        fields.append(el('label', {}, input, ' Reverse direction'));
      }
    }
  };
  type.onchange = () => {
    const keep = draft.effect;
    draft.effect = { type: type.value };
    for (const f of EFFECTS[type.value].fields) if (keep[f] !== undefined) draft.effect[f] = keep[f];
    drawFields();
    live();
  };
  name.onchange = () => {
    const n = name.value.trim();
    if (!n || config.profiles.some((p) => p !== profile && p.name === n)) { name.value = profile.name; return toast('Name must be unique'); }
    if (config.active_profile === profile.name) config.active_profile = n;
    profile.name = draft.name = editing = n;
    saveConfig('Renamed');
  };
  drawFields();

  const del = el('button', { className: 'btn danger', textContent: 'Delete profile' });
  del.onclick = () => {
    if (config.profiles.length < 2) return toast('Keep at least one profile');
    config.profiles = config.profiles.filter((p) => p !== profile);
    if (config.active_profile === profile.name) config.active_profile = config.profiles[0].name;
    editing = config.active_profile;
    saveConfig('Deleted');
    renderEditor();
  };
  const overrides = Object.keys(draft.overrides || {});
  root.replaceChildren(
    el('label', { textContent: 'Name' }), name,
    el('label', { textContent: 'Effect' }), type,
    fields,
    overrides.length ? el('p', { className: 'note', textContent: `Per-device overrides in config file: ${overrides.join(', ')}` }) : '',
    el('div', { className: 'actions' }, del),
  );
}

function renderChannels() {
  if (!config) return;
  $('channels').replaceChildren(...config.argb_channels.map((ch, i) => {
    const name = el('input', { type: 'text', value: ch.name });
    const leds = el('input', { type: 'number', min: 0, max: 80, value: ch.leds });
    const link = el('input', { type: 'number', min: 0, max: 4, placeholder: 'auto', value: ch.chroma_link_led ?? '' });
    name.oninput = () => { ch.name = name.value; };
    leds.oninput = () => { ch.leds = Math.max(0, Math.min(80, parseInt(leds.value) || 0)); };
    link.oninput = () => { ch.chroma_link_led = link.value === '' ? null : Math.max(0, Math.min(4, parseInt(link.value) || 0)); };
    return el('div', { className: 'chan' },
      el('div', {}, el('label', { textContent: `Channel ${i + 1}` }), name),
      el('div', {}, el('label', { textContent: 'LEDs' }), leds),
      el('div', {}, el('label', { textContent: 'Link' }), link));
  }));
}

$('save-channels').onclick = () => {
  for (const ch of config.argb_channels) if (ch.chroma_link_led === null) delete ch.chroma_link_led;
  saveConfig('Channels saved');
};

let brightnessTimer;
$('brightness').oninput = () => {
  $('brightness-val').textContent = $('brightness').value + '%';
  clearTimeout(brightnessTimer);
  brightnessTimer = setTimeout(() => api('POST', '/api/settings', { brightness: +$('brightness').value }), 120);
};
$('sdk-enabled').onchange = () => api('POST', '/api/settings', { sdk_enabled: $('sdk-enabled').checked });
$('new-profile').onclick = () => {
  let n = 1;
  while (config.profiles.some((p) => p.name === `Profile ${n}`)) n++;
  config.profiles.push({ name: `Profile ${n}`, effect: { type: 'static', color: '#ffffff' } });
  editing = `Profile ${n}`;
  saveConfig('Created');
  renderEditor();
};

async function poll() {
  try {
    status = await api('GET', '/api/status');
    document.body.classList.remove('offline');
    if (!config) {
      config = await api('GET', '/api/config');
      renderProfiles();
      renderEditor();
      renderChannels();
    }
    if (status.active_profile !== config.active_profile) {
      config = await api('GET', '/api/config');
      renderProfiles();
    }
  } catch {
    status = null;
    document.body.classList.add('offline');
  }
  try {
    renderPills();
    renderDevices();
    renderSettings();
  } catch (e) {
    console.error('render failed', e);
  } finally {
    setTimeout(poll, 150);
  }
}
poll();
</script>
</body>
</html>
